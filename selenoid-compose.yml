services:
  selenoid:
    image: aerokube/selenoid:latest-release
    volumes:
      - ./config:/etc/selenoid:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "4444:4444"
    networks:
      - selenoid

  selenoid-ui:
    image: aerokube/selenoid-ui:latest-release
    depends_on:
      - selenoid
    command: ["--selenoid-uri", "http://selenoid:4444"]
    ports:
      - "8090:8080"
    networks:
      - selenoid

networks:
  selenoid:
    name: selenoid
